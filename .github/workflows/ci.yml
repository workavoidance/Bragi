name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install -r requirements-dev.txt
          -c constraints-windows.txt
      - name: Verify editable installation
        run: python -m pip install -e . -c constraints-windows.txt
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Compile modules
        run: python -m compileall -q src tests tools

  store-package-schema:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Microsoft Store package
        shell: powershell
        run: >-
          .\build_store_msix.ps1
          -Version "v0.2.0-alpha.2"
          -StoreBuild "${{ github.run_number }}"
          -ExecutablePath "$env:WINDIR\System32\notepad.exe"
          -OutputDirectory "$env:RUNNER_TEMP\skrivi-store"
