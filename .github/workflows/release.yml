name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build portable executable
        shell: powershell
        run: .\build_portable.ps1
      - name: Install installer compiler
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build per-user installer
        shell: powershell
        run: .\build_installer.ps1 -Version "${{ github.ref_name }}"
      - name: Package release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\Skrivi.exe release\
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md release\
          $archive = "Skrivi-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path release\* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash *$archive" | Set-Content "$archive.sha256"
          $installer = Get-Item "dist\installer\Skrivi-*-windows-x64-setup.exe"
          $publishedInstaller = "Skrivi-${{ github.ref_name }}-windows-x64-setup.exe"
          Copy-Item $installer.FullName $publishedInstaller
          $installerHash = (Get-FileHash $publishedInstaller -Algorithm SHA256).Hash.ToLower()
          "$installerHash *$publishedInstaller" | Set-Content "$publishedInstaller.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Skrivi-${{ github.ref_name }}-windows-x64
          path: |
            Skrivi-${{ github.ref_name }}-windows-x64.zip
            Skrivi-${{ github.ref_name }}-windows-x64.zip.sha256
            Skrivi-*-windows-x64-setup.exe
            Skrivi-*-windows-x64-setup.exe.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseArgs = @(
            "release", "create", $tag,
            "Skrivi-$tag-windows-x64.zip",
            "Skrivi-$tag-windows-x64.zip.sha256",
            "Skrivi-$tag-windows-x64-setup.exe",
            "Skrivi-$tag-windows-x64-setup.exe.sha256",
            "--title", "Skrivi $tag"
          )
          $notesFile = "docs/releases/$tag.md"
          if (Test-Path $notesFile) {
            $releaseArgs += @("--notes-file", $notesFile)
          } else {
            $releaseArgs += "--generate-notes"
          }
          if ($tag.Contains("-")) {
            $releaseArgs += "--prerelease"
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }
