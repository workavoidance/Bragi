[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skrivi"
version = "0.2.0a4"
description = "Private, local push-to-talk dictation for Windows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
keywords = ["dictation", "speech-to-text", "whisper", "windows", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=0.34,<2",
    "numpy>=1.26,<3",
    "pynput>=1.7,<2",
    "PySide6-Essentials>=6.11,<6.12",
    "sounddevice>=0.5,<1",
    "tqdm>=4.65,<5",
    "winrt-Windows.ApplicationModel>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
